<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Market Store</title><style>body{margin:0;font-family:Arial;background:#fafafa;color:#111}.top{background:#111;color:#fff;padding:18px}.hero{background:#191919;color:#fff;padding:50px 20px}.wrap{max-width:1000px;margin:auto}.hero h1{font-size:48px;margin:0 0 10px}.desc{color:#ccc}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:25px 15px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px}.pic{height:160px;background:#eee;border-radius:10px;display:block;width:100%;object-fit:cover}.emoji{display:grid;place-items:center;font-size:50px}.price{font-size:20px;font-weight:900;margin:10px 0}.wa{display:block;text-align:center;background:#20c56a;color:#fff;text-decoration:none;padding:12px;border-radius:8px;font-weight:bold;border:0;width:100%;cursor:pointer}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px}.modalBox{background:#fff;padding:22px;border-radius:15px;width:min(430px,100%)}.modalBox input{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.cancel{background:#eee;border:0;padding:10px;border-radius:8px;margin-left:7px}@media(max-width:700px){.products{grid-template-columns:1fr 1fr}}@media(max-width:450px){.products{grid-template-columns:1fr}.hero h1{font-size:38px}}</style></head><body><div class="top"><div class="wrap">🛍️ <b>NOVA MARKET</b></div></div><section class="hero"><div class="wrap"><h1 id="name">Nova Market</h1><div id="desc" class="desc">Shop with us.</div></div></section><main class="wrap"><div id="products" class="products"><p>Loading store...</p></div></main><div class="modal" id="modal"><div class="modalBox"><h2>Place your order</h2><p id="chosen"></p><input id="customer" placeholder="Your name"><input id="phone" placeholder="Your phone number"><input id="note" placeholder="Note (optional)"><button class="wa" id="submit">Confirm order</button><button class="cancel" id="cancel">Cancel</button><p id="msg"></p></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cjaukxtlnppxzuhwozyf.supabase.co','sb_publishable_CbfRdYSeGGztUkiMqwk6Iw_55WqqwiN');const shop=(new URLSearchParams(location.search).get('shop')||'').trim().toLowerCase();let store,chosen,products=[];const $=x=>document.getElementById(x);async function load(){if(!shop){$('products').innerHTML='<p>Store not found.</p>';return}const s=await db.from('stores').select('*').eq('slug',shop).maybeSingle();if(s.error||!s.data){$('products').innerHTML='<p>Store not found.</p>';return}store=s.data;document.title=store.name+' — Nova Market';$('name').textContent=store.name;$('desc').textContent=store.description||'Shop with us.';const p=await db.from('products').select('*').eq('store_id',store.id).eq('active',true).order('created_at',{ascending:false});if(p.error){$('products').innerHTML='<p>Could not load products. Please refresh.</p>';return}products=p.data||[];if(!products.length){$('products').innerHTML='<p>No products yet.</p>';return}$('products').innerHTML=products.map((x,i)=>'<article class="card">'+(x.image_url?'<img class="pic" src="'+esc(x.image_url)+'">':'<div class="pic emoji">🛍️</div>')+'<h2>'+esc(x.name)+'</h2><div class="price">GH₵'+x.price+'</div><button class="wa" onclick="openOrder(\''+x.id+'\',\''+esc(x.name).replace(/'/g,"\\'")+'\','+Number(x.price)+')">🛒 Order now</button></article>').join('')}window.openOrder=(i)=>{chosen=products[i];$('chosen').textContent=name+' — GH₵'+price;$('customer').value='';$('phone').value='';$('note').value='';$('msg').textContent='';$('modal').style.display='grid'};$('cancel').onclick=()=>$('modal').style.display='none';$('submit').onclick=async()=>{const customer=$('customer').value.trim(),phone=$('phone').value.trim(),note=$('note').value.trim();if(!customer||!phone){$('msg').textContent='Please enter your name and phone number.';return}const q=await db.from('orders').insert({store_id:store.id,product_id:chosen.id,product_name:chosen.name,customer_name:customer,customer_phone:phone,amount:chosen.price,customer_note:note,status:'pending'});if(q.error){$('msg').textContent='Could not place order: '+q.error.message;return}$('msg').textContent='✅ Order received! The seller will contact you.';const wa='https://wa.me/'+(store.whatsapp||'')+'?text='+encodeURIComponent('Hello! I placed an order for '+chosen.name+' (GH₵'+chosen.price+'). Name: '+customer+'. Phone: '+phone+'.');if(store.whatsapp)window.open(wa,'_blank');setTimeout(()=>$('modal').style.display='none',900)};function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}document.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)openOrder(Number(b.dataset.i))});load();</script></body></html>
