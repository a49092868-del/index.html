<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova Market Store</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fafafa;color:#111}.top{background:#101010;color:#fff;padding:18px}.inner{max-width:1050px;margin:auto}.hero{background:#111;color:#fff;padding:55px 18px}.hero h1{font-size:48px;margin:0 0 10px}.yellow{color:#ffd400}.desc{color:#ccc}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;padding:30px 18px}.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:20px}.pic{height:150px;background:#eee;border-radius:10px;display:grid;place-items:center;font-size:55px}.price{font-weight:900;font-size:20px;margin:10px 0}.wa{display:block;text-align:center;background:#20c56a;color:#fff;text-decoration:none;padding:12px;border-radius:9px;font-weight:800}@media(max-width:700px){.products{grid-template-columns:1fr 1fr}.hero h1{font-size:36px}}@media(max-width:450px){.products{grid-template-columns:1fr}}
</style></head><body><div class="top"><div class="inner"><b>◈ NOVA MARKET</b></div></div>
<section class="hero"><div class="inner"><h1 id="name">My Store</h1><div id="desc" class="desc">Welcome to my store.</div></div></section>
<main class="inner"><div class="products" id="products"></div></main>
<script>
let s;try{s=JSON.parse(localStorage.getItem('novaStore')||'null')}catch(e){}if(!s)s={name:'Demo Store',wa:'233XXXXXXXXX',desc:'A Nova Market seller store.',products:[{name:'Demo Watch',price:'150'},{name:'Classic T-Shirt',price:'100'}]};document.title=s.name+' — Nova Market';document.getElementById('name').textContent=s.name;document.getElementById('desc').textContent=s.desc||'Shop on Nova Market';document.getElementById('products').innerHTML=(s.products||[]).map(p=>{let m=encodeURIComponent('Hello! I want to order '+p.name+' for GH₵'+p.price);return '<article class="card"><div class="pic">🛍️</div><h2>'+p.name+'</h2><div class="price">GH₵'+p.price+'</div><a class="wa" target="_blank" href="https://wa.me/'+(s.wa||'233XXXXXXXXX')+'?text='+m+'">💬 Order on WhatsApp</a></article>'}).join('');
</script></body></html>
