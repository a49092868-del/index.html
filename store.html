<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Market Store</title><style>body{margin:0;font-family:Arial;background:#fafafa;color:#111}.top{background:#111;color:#fff;padding:18px}.hero{background:#191919;color:#fff;padding:50px 20px}.wrap{max-width:1000px;margin:auto}.hero h1{font-size:48px;margin:0 0 10px}.desc{color:#ccc}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:25px 15px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:16px}.pic{height:160px;background:#eee;border-radius:10px;display:grid;place-items:center;font-size:50px}.price{font-size:20px;font-weight:900;margin:10px 0}.wa{display:block;text-align:center;background:#20c56a;color:#fff;text-decoration:none;padding:12px;border-radius:8px;font-weight:bold}@media(max-width:700px){.products{grid-template-columns:1fr 1fr}}@media(max-width:450px){.products{grid-template-columns:1fr}}</style></head><body><div class="top"><div class="wrap">🛍️ <b>NOVA MARKET</b></div></div><section class="hero"><div class="wrap"><h1 id="name">Nova Market</h1><div id="desc" class="desc">Shop with us.</div></div></section><main class="wrap"><div id="products" class="products"><p>Loading store...</p></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cjaukxtlnppxzuhwozyf.supabase.co','sb_publishable_CbfRdYSeGGztUkiMqwk6Iw_55WqqwiN');const shop=new URLSearchParams(location.search).get('shop');async function load(){if(!shop){$('products').innerHTML='<p>Store not found.</p>';return}const s=await db.from('stores').select('*').eq('slug',shop).maybeSingle();if(s.error||!s.data){$('products').innerHTML='<p>Store not found.</p>';return}const store=s.data;document.title=store.name+' — Nova Market';$('name').textContent=store.name;$('desc').textContent=store.description||'Shop with us.';const p=await db.from('products').select('*').eq('store_id',store.id).order('created_at',{ascending:false});if(p.error||!p.data.length){$('products').innerHTML='<p>No products yet.</p>';return}$('products').innerHTML=p.data.map(x=>{const text=encodeURIComponent('Hello! I want to order '+x.name+' for GH₵'+x.price);return '<article class="card">'+(x.image_url?'<img class="pic" src="'+esc(x.image_url)+'" style="object-fit:cover;width:100%">':'<div class="pic">🛍️</div>')+'<h2>'+esc(x.name)+'</h2><div class="price">GH₵'+x.price+'</div><a class="wa" target="_blank" href="https://wa.me/'+(store.whatsapp||'')+'?text='+text+'">💬 Order on WhatsApp</a></article>'}).join('')}function $(x){return document.getElementById(x)}function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}load();</script></body></html>
