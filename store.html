<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopify GH Store</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f7f7;color:#111}.top{background:#111;color:#fff;padding:16px}.wrap{max-width:1050px;margin:auto}.hero{color:#fff;padding:45px 20px;background:#191919 center/cover}.brand{display:flex;gap:12px;align-items:center}.brand img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#fff}.hero h1{font-size:42px;margin:15px 0 6px}.desc{color:#ddd}.toolbar{padding:20px 15px;display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:190px;padding:12px;border:1px solid #ddd;border-radius:24px}.filter{padding:11px;border:1px solid #ddd;border-radius:22px;background:#fff}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 15px 35px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px}.pic{height:190px;background:#eee;border-radius:10px;width:100%;object-fit:cover}.price{font-size:20px;font-weight:900;margin:8px 0}.meta{color:#777;font-size:13px}.btn{display:block;text-align:center;background:#20c56a;color:#fff;padding:11px;border-radius:8px;font-weight:bold;border:0;width:100%;cursor:pointer;margin-top:8px}.yellow{background:#ffd400;color:#111}.disabled{background:#aaa}.cart{position:fixed;right:14px;bottom:14px;background:#111;color:#fff;padding:14px 18px;border-radius:30px;border:2px solid #ffd400;font-weight:900;z-index:9}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px;z-index:20}.box{background:#fff;padding:20px;border-radius:16px;width:min(500px,100%);max-height:90vh;overflow:auto}.box input,.box textarea{width:100%;padding:11px;margin:6px 0 10px;border:1px solid #ddd;border-radius:8px}.cartrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:10px 0;border-bottom:1px solid #eee}.close{float:right;border:0;background:#eee;padding:8px;border-radius:8px}.coupon{display:flex;gap:7px}.coupon input{flex:1}.success{padding:12px;background:#e8fff1;border-radius:10px;color:#075c2a}@media(max-width:700px){.products{grid-template-columns:1fr 1fr}}@media(max-width:450px){.products{grid-template-columns:1fr}.hero h1{font-size:34px}}
</style></head><body><div class="top"><div class="wrap">🛍️ <b>SHOPIFY GH</b></div></div><section class="hero" id="hero"><div class="wrap"><div class="brand"><img id="logo" style="display:none"><div><h1 id="name">Shopify GH Store</h1><div id="desc" class="desc">Shop with us.</div></div></div></div></section><main class="wrap"><div class="toolbar"><input class="search" id="search" placeholder="Search this store..." oninput="render()"><select class="filter" id="cat" onchange="render()"><option>All</option><option>Men</option><option>Women</option><option>Shoes</option><option>Bags</option><option>Watches</option><option>Accessories</option><option>Caps</option><option>Perfumes</option><option>Other</option></select><select class="filter" id="sort" onchange="render()"><option value="new">Newest</option><option value="low">Price: Low to high</option><option value="high">Price: High to low</option><option value="az">Name A-Z</option></select></div><div id="products" class="products"><p>Loading store...</p></div><div style="padding:0 15px 35px"><a href="/track" class="btn yellow">📦 Track an Order</a></div></main><button class="cart" onclick="openCart()">🛒 Cart (<span id="count">0</span>)</button>
<div class="modal" id="cartModal"><div class="box"><button class="close" onclick="closeModal('cartModal')">✕</button><h2>Your cart</h2><div id="cartItems"></div><h3 id="cartTotal"></h3><button class="btn" onclick="checkout()">Checkout</button></div></div>
<div class="modal" id="checkoutModal"><div class="box"><button class="close" onclick="closeModal('checkoutModal')">✕</button><h2>Checkout</h2><input id="customer" placeholder="Your name"><input id="phone" placeholder="Your phone number"><textarea id="note" placeholder="Delivery note (optional)"></textarea><div class="coupon"><input id="coupon" placeholder="Discount code"><button class="btn yellow" style="width:auto" onclick="applyCoupon()">Apply</button></div><p id="couponMsg"></p><h3 id="checkoutTotal"></h3><button class="btn" onclick="placeOrder()">Place order</button><p id="checkoutMsg"></p></div></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cjaukxtlnppxzuhwozyf.supabase.co','sb_publishable_CbfRdYSeGGztUkiMqwk6Iw_55WqqwiN');const params=new URLSearchParams(location.search);const pathMatch=location.pathname.match(/^\/store\/([^/]+)/i);const shop=(params.get('shop')||(pathMatch?decodeURIComponent(pathMatch[1]):'')).trim().toLowerCase();let store,products=[],cart=JSON.parse(localStorage.getItem('sgh-cart-'+shop)||'[]'),coupon=null;
const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function load(){if(!shop)return $('products').innerHTML='<p>Store not found.</p>';let s=await db.from('stores').select('*').eq('slug',shop).maybeSingle();if(s.error||!s.data)return $('products').innerHTML='<p>Store not found.</p>';store=s.data;document.title=store.name+' — Shopify GH';$('name').textContent=store.name;$('desc').textContent=store.description||'Shop with us.';if(store.logo_url){$('logo').src=store.logo_url;$('logo').style.display='block'}if(store.banner_url)$('hero').style.backgroundImage='linear-gradient(#0008,#0008),url('+JSON.stringify(store.banner_url)+')';let p=await db.from('products').select('*').eq('store_id',store.id).eq('active',true).order('created_at',{ascending:false});products=p.data||[];render();updateCount()}
function render(){let q=$('search').value.toLowerCase().trim(),cat=$('cat').value,sort=$('sort').value;let list=products.filter(p=>(!q||(p.name+' '+(p.description||'')).toLowerCase().includes(q))&&(cat==='All'||(p.category||'Other')===cat));if(sort==='low')list.sort((a,b)=>a.price-b.price);if(sort==='high')list.sort((a,b)=>b.price-a.price);if(sort==='az')list.sort((a,b)=>a.name.localeCompare(b.name));$('products').innerHTML=list.length?list.map(p=>{let out=Number(p.stock)<=0;return '<article class="card">'+(p.image_url?'<img class="pic" src="'+esc(p.image_url)+'">':'<div class="pic" style="display:grid;place-items:center;font-size:60px">🛍️</div>')+'<h2>'+esc(p.name)+'</h2><div class="meta">'+esc(p.category||'Other')+' · '+(out?'Out of stock':esc(p.stock)+' available')+'</div><div class="price">GH₵'+Number(p.price).toFixed(2)+'</div><div class="meta">'+esc(p.description||'')+'</div><button class="btn '+(out?'disabled':'')+'" '+(out?'disabled':'onclick="addToCart(\''+p.id+'\')"')+'>'+ (out?'Out of stock':'🛒 Add to cart')+'</button></article>'}).join(''):'<p>No products found.</p>'}
function save(){localStorage.setItem('sgh-cart-'+shop,JSON.stringify(cart));updateCount()}function updateCount(){$('count').textContent=cart.reduce((n,x)=>n+x.quantity,0)}window.addToCart=id=>{let p=products.find(x=>x.id===id);if(!p||p.stock<1)return;let x=cart.find(x=>x.product_id===id);if(x)x.quantity=Math.min(x.quantity+1,p.stock);else cart.push({product_id:id,name:p.name,price:Number(p.price),quantity:1,stock:Number(p.stock)});save();openCart()}
window.changeQty=(id,d)=>{let x=cart.find(x=>x.product_id===id);if(!x)return;x.quantity+=d;if(x.quantity<1)cart=cart.filter(y=>y.product_id!==id);else x.quantity=Math.min(x.quantity,x.stock);save();openCart()}
function total(){return cart.reduce((n,x)=>n+x.price*x.quantity,0)}function openCart(){$('cartItems').innerHTML=cart.length?cart.map(x=>'<div class="cartrow"><span>'+esc(x.name)+'</span><span><button onclick="changeQty(\''+x.product_id+'\',-1)">−</button> '+x.quantity+' <button onclick="changeQty(\''+x.product_id+'\',1)">+</button></span><b>GH₵'+(x.price*x.quantity).toFixed(2)+'</b></div>').join(''):'<p>Your cart is empty.</p>';$('cartTotal').textContent='Subtotal: GH₵'+total().toFixed(2);$('cartModal').style.display='grid'}window.openCart=openCart;window.closeModal=id=>$(id).style.display='none';
window.checkout=()=>{if(!cart.length)return alert('Your cart is empty.');$('cartModal').style.display='none';$('checkoutTotal').textContent='Subtotal: GH₵'+total().toFixed(2);$('checkoutModal').style.display='grid'};
window.applyCoupon=async()=>{let code=$('coupon').value.trim();if(!code)return;let q=await db.from('discount_codes').select('*').eq('store_id',store.id).ilike('code',code).eq('active',true).maybeSingle();if(q.data&&(!q.data.expires_at||new Date(q.data.expires_at)>new Date())&&(!q.data.usage_limit||q.data.used_count<q.data.usage_limit)){coupon=q.data;$('couponMsg').textContent='✅ Coupon applied';let d=q.data.type==='percent'?total()*q.data.value/100:Math.min(total(),q.data.value);$('checkoutTotal').textContent='Total: GH₵'+Math.max(0,total()-d).toFixed(2)}else{coupon=null;$('couponMsg').textContent='Invalid or expired coupon.'}};
window.placeOrder=async()=>{let customer=$('customer').value.trim(),phone=$('phone').value.trim();if(!customer||!phone){$('checkoutMsg').textContent='Enter your name and phone number.';return}let r=await db.rpc('place_order',{p_store_id:store.id,p_customer_name:customer,p_customer_phone:phone,p_customer_note:$('note').value.trim(),p_items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity})),p_coupon:coupon?.code||null});if(r.error){$('checkoutMsg').textContent='❌ '+r.error.message;return}cart=[];save();$('checkoutMsg').innerHTML='<div class="success">✅ Order placed!<br>Order number: <b>'+esc(r.data.order_number)+'</b><br>Save this number and your phone number to track the order.</div>';if(store.whatsapp){let wa=store.whatsapp.replace(/\D/g,'');window.open('https://wa.me/'+wa+'?text='+encodeURIComponent('New Shopify GH order '+r.data.order_number+' — '+customer+' — GH₵'+r.data.total),'_blank')}setTimeout(()=>{closeModal('checkoutModal');location.href='/track'},2500)};
load();
</script></body></html>
