<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Market Store</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f7f7;color:#111}.top{background:#111;color:#fff;padding:16px}.wrap{max-width:1050px;margin:auto}.hero{color:#fff;padding:55px 20px;background:#191919 center/cover}.brand{display:flex;gap:12px;align-items:center}.brand img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#fff}.hero h1{font-size:44px;margin:18px 0 8px}.desc{color:#ddd}.toolbar{padding:20px 15px;display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:200px;padding:12px;border:1px solid #ddd;border-radius:24px}.filter{padding:11px;border:1px solid #ddd;border-radius:22px;background:#fff}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:0 15px 30px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:12px;overflow:hidden}.pic{height:190px;background:#eee;border-radius:10px;display:block;width:100%;object-fit:cover}.price{font-size:20px;font-weight:900;margin:9px 0}.meta{color:#777;font-size:13px}.wa{display:block;text-align:center;background:#20c56a;color:#fff;padding:12px;border-radius:8px;font-weight:bold;border:0;width:100%;cursor:pointer}.disabled{background:#aaa}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:18px}.modalBox{background:#fff;padding:22px;border-radius:15px;width:min(430px,100%)}.modalBox input{width:100%;padding:12px;margin:7px 0 12px;border:1px solid #ddd;border-radius:8px}.cancel{background:#eee;border:0;padding:10px;border-radius:8px;margin-left:7px}@media(max-width:700px){.products{grid-template-columns:1fr 1fr}}@media(max-width:450px){.products{grid-template-columns:1fr}.hero h1{font-size:36px}}</style></head><body><div class="top"><div class="wrap">🛍️ <b>NOVA MARKET</b></div></div><section class="hero" id="hero"><div class="wrap"><div class="brand"><img id="logo" style="display:none"><div><h1 id="name">Nova Market</h1><div id="desc" class="desc">Shop with us.</div></div></div></div></section><main class="wrap"><div class="toolbar"><input class="search" id="search" placeholder="Search this store..." oninput="render()"><select class="filter" id="cat" onchange="render()"><option>All</option><option>Men</option><option>Women</option><option>Shoes</option><option>Bags</option><option>Watches</option><option>Accessories</option><option>Caps</option><option>Perfumes</option><option>Other</option></select><select class="filter" id="sort" onchange="render()"><option value="new">Newest</option><option value="low">Price: Low to high</option><option value="high">Price: High to low</option><option value="az">Name A-Z</option></select></div><div id="products" class="products"><p>Loading store...</p></div></main><div class="modal" id="modal"><div class="modalBox"><h2>Place your order</h2><p id="chosen"></p><input id="customer" placeholder="Your name"><input id="phone" placeholder="Your phone number"><input id="note" placeholder="Note (optional)"><button class="wa" id="submit">Confirm order</button><button class="cancel" id="cancel">Cancel</button><p id="msg"></p></div></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cjaukxtlnppxzuhwozyf.supabase.co','sb_publishable_CbfRdYSeGGztUkiMqwk6Iw_55WqqwiN');const shop=(new URLSearchParams(location.search).get('shop')||'').trim().toLowerCase();let store,chosen,products=[];const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function load(){if(!shop){$('products').innerHTML='<p>Store not found.</p>';return}const s=await db.from('stores').select('*').eq('slug',shop).maybeSingle();if(s.error||!s.data){$('products').innerHTML='<p>Store not found.</p>';return}store=s.data;document.title=store.name+' — Nova Market';$('name').textContent=store.name;$('desc').textContent=store.description||'Shop with us.';if(store.logo_url){$('logo').src=store.logo_url;$('logo').style.display='block'}if(store.banner_url)$('hero').style.backgroundImage='linear-gradient(#0008,#0008),url('+JSON.stringify(store.banner_url)+')';const p=await db.from('products').select('*').eq('store_id',store.id).eq('active',true).order('created_at',{ascending:false});if(p.error){$('products').innerHTML='<p>Could not load products. Please refresh.</p>';return}products=p.data||[];render()}function render(){const q=($('search').value||'').toLowerCase().trim(),cat=$('cat').value,sort=$('sort').value;let list=products.filter(p=>(!q||(p.name+' '+(p.description||'')).toLowerCase().includes(q))&&(cat==='All'||(p.category||'Other')===cat));$('products').innerHTML=list.length?list.map((x,i)=>{const out=Number(x.stock)<=0;return '<article class="card">'+(x.image_url?'<img class="pic" src="'+esc(x.image_url)+'" alt="'+esc(x.name)+'">':'<div class="pic">🛍️</div>')+'<h2>'+esc(x.name)+'</h2><div class="meta">'+esc(x.category||'Other')+' · '+(out?'Out of stock':esc(x.stock)+' available')+'</div><div class="price">GH₵'+Number(x.price).toFixed(2)+'</div><button class="wa '+(out?'disabled':'')+'" '+(out?'disabled':'data-i="'+i+'"')+'>'+(out?'Out of stock':'🛒 Order now')+'</button></article>'}).join(''):'<p>No products found.</p>'}window.openOrder=i=>{chosen=products.filter(p=>{const q=($('search').value||'').toLowerCase().trim(),cat=$('cat').value;return(!q||(p.name+' '+(p.description||'')).toLowerCase().includes(q))&&(cat==='All'||(p.category||'Other')===cat)})[i];if(!chosen)return;$('chosen').textContent=chosen.name+' — GH₵'+Number(chosen.price).toFixed(2);$('customer').value='';$('phone').value='';$('note').value='';$('msg').textContent='';$('modal').style.display='grid'};$('cancel').onclick=()=>$('modal').style.display='none';$('submit').onclick=async()=>{const customer=$('customer').value.trim(),phone=$('phone').value.trim(),note=$('note').value.trim();if(!customer||!phone){$('msg').textContent='Please enter your name and phone number.';return}const q=await db.from('orders').insert({store_id:store.id,product_id:chosen.id,product_name:chosen.name,customer_name:customer,customer_phone:phone,amount:chosen.price,customer_note:note,status:'pending'});if(q.error){$('msg').textContent='Could not place order: '+q.error.message;return}$('msg').textContent='✅ Order received!';if(store.whatsapp){const wa='https://wa.me/'+store.whatsapp+'?text='+encodeURIComponent('Hello! I placed an order for '+chosen.name+' (GH₵'+chosen.price+'). Name: '+customer+'. Phone: '+phone+'.');window.open(wa,'_blank')}setTimeout(()=>$('modal').style.display='none',900)};document.addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)window.openOrder(Number(b.dataset.i))});load();</script></body></html>
