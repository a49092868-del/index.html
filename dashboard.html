<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Market Dashboard</title><style>body{font-family:Arial;margin:0;background:#f5f5f5;color:#111}.top{background:#111;color:#fff;padding:16px;font-weight:900}.wrap{max-width:900px;margin:auto;padding:20px}.box{background:#fff;padding:20px;border-radius:16px;margin-bottom:18px}.field{margin:12px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.btn{padding:12px 16px;border:0;border-radius:8px;background:#ffd400;font-weight:bold}.product{padding:12px;border:1px solid #eee;border-radius:10px;margin:8px 0;display:flex;justify-content:space-between}.muted{color:#777}a{word-break:break-all}</style></head><body><div class="top">🛍️ NOVA MARKET — SELLER DASHBOARD</div><main class="wrap"><div class="box"><h1>My Store</h1><p id="account" class="muted">Checking account...</p><div class="field"><label>Store name</label><input id="name" placeholder="My Store"></div><div class="field"><label>Store URL name</label><input id="slug" placeholder="my-store"></div><div class="field"><label>WhatsApp</label><input id="wa" placeholder="233XXXXXXXXX"></div><div class="field"><label>Description</label><textarea id="desc" placeholder="What do you sell?"></textarea></div><button class="btn" id="save">Save store</button><p id="status"></p></div><div class="box"><h2>Products</h2><button class="btn" id="add">+ Add product</button><div id="products"></div></div><div class="box"><h2>Public store</h2><a id="link">Save your store first</a></div><button class="btn" id="logout">Log out</button></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cjaukxtlnppxzuhwozyf.supabase.co','sb_publishable_CbfRdYSeGGztUkiMqwk6Iw_55WqqwiN');let user,store;const $=x=>document.getElementById(x);function slug(x){return x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}async function start(){const r=await db.auth.getUser();user=r.data.user;if(!user){location.href='login.html';return}$('account').textContent='Logged in: '+user.email;const q=await db.from('stores').select('*').eq('owner_id',user.id).maybeSingle();if(q.error){$('status').textContent=q.error.message;return}store=q.data;if(store){$('name').value=store.name||'';$('slug').value=store.slug||'';$('wa').value=store.whatsapp||'';$('desc').value=store.description||'';showLink();loadProducts()}}async function save(){const name=$('name').value.trim();const s=slug($('slug').value||name);if(!name||!s){$('status').textContent='Enter a store name.';return}const data={owner_id:user.id,name,slug:s,whatsapp:$('wa').value.replace(/\\D/g,''),description:$('desc').value.trim()};const q=store?await db.from('stores').update(data).eq('id',store.id).select().single():await db.from('stores').insert(data).select().single();if(q.error){$('status').textContent=q.error.message;return}store=q.data;$('slug').value=store.slug;$('status').textContent='✅ Store saved!';showLink()}function showLink(){const u=location.href.replace('dashboard.html','store.html')+'?shop='+encodeURIComponent(store.slug);$('link').href=u;$('link').textContent=u}async function loadProducts(){const q=await db.from('products').select('*').eq('store_id',store.id).order('created_at',{ascending:false});if(q.error)return;$('products').innerHTML=q.data.map(p=>'<div class="product"><span><b>'+esc(p.name)+'</b><br>GH₵'+p.price+'</span><button data-id="'+p.id+'">Delete</button></div>').join('');document.querySelectorAll('[data-id]').forEach(b=>b.onclick=async()=>{await db.from('products').delete().eq('id',b.dataset.id);loadProducts()})}async function add(){if(!store){$('status').textContent='Save your store first.';return}const name=prompt('Product name');if(!name)return;const price=prompt('Price in GH₵','0');if(price===null)return;const image_url=prompt('Product image URL (optional)','')||null;const q=await db.from('products').insert({store_id:store.id,name:name.trim(),price:Number(price)||0,image_url});$('status').textContent=q.error?q.error.message:'✅ Product added!';loadProducts()}function esc(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}$('save').onclick=save;$('add').onclick=add;$('logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};start();</script></body></html>
