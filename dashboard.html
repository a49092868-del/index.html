<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Market Dashboard</title><style>body{font-family:Arial;margin:0;background:#f5f5f5;color:#111}.top{background:#111;color:#fff;padding:16px;font-weight:900}.wrap{max-width:950px;margin:auto;padding:20px}.box{background:#fff;padding:20px;border-radius:16px;margin-bottom:18px}.field{margin:10px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.btn{padding:11px 15px;border:0;border-radius:8px;background:#ffd400;font-weight:bold;cursor:pointer}.dark{background:#111;color:#fff}.product{padding:12px;border:1px solid #eee;border-radius:10px;margin:8px 0;display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center}.product img{width:70px;height:70px;object-fit:cover;border-radius:8px}.actions button{margin:2px;padding:7px;border:0;border-radius:6px;cursor:pointer}.muted{color:#777}.order{border:1px solid #eee;border-radius:10px;padding:12px;margin:8px 0}@media(max-width:600px){.product{grid-template-columns:60px 1fr}.actions{grid-column:2}.product img{width:60px;height:60px}}</style></head><body><div class="top">🛍️ NOVA MARKET — SELLER DASHBOARD</div><main class="wrap"><div class="box"><h1>My Store</h1><p id="account" class="muted">Checking account...</p><div class="field"><label>Store name</label><input id="name"></div><div class="field"><label>Store URL name</label><input id="slug" placeholder="my-store"></div><div class="field"><label>WhatsApp</label><input id="wa" placeholder="233XXXXXXXXX"></div><div class="field"><label>Description</label><textarea id="desc"></textarea></div><button class="btn" id="save">Save store</button><p id="status"></p></div><div class="box"><h2>Products</h2><button class="btn" id="add">+ Add product</button><div id="products"></div></div><div class="box"><h2>Orders</h2><div id="orders"><span class="muted">No orders loaded yet.</span></div></div><div class="box"><h2>Public store</h2><a id="link">Save your store first</a></div><button class="btn dark" id="logout">Log out</button></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cjaukxtlnppxzuhwozyf.supabase.co','sb_publishable_CbfRdYSeGGztUkiMqwk6Iw_55WqqwiN');let user,store;const $=x=>document.getElementById(x);function slug(x){return x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function start(){const r=await db.auth.getUser();user=r.data.user;if(!user){location.href='login.html';return}$('account').textContent='Logged in: '+user.email;const q=await db.from('stores').select('*').eq('owner_id',user.id).maybeSingle();if(q.error){$('status').textContent=q.error.code==='23505'?'That store URL is already taken. Choose another one.':q.error.message;return}store=q.data;if(store){$('name').value=store.name||'';$('slug').value=store.slug||'';$('wa').value=store.whatsapp||'';$('desc').value=store.description||'';showLink();loadProducts();loadOrders()}}async function save(){const name=$('name').value.trim(),s=slug($('slug').value||name);if(!name||!s){$('status').textContent='Enter a store name.';return}if(s.length<3){$('status').textContent='Store URL name must be at least 3 characters.';return}const data={owner_id:user.id,name,slug:s,whatsapp:$('wa').value.replace(/\D/g,''),description:$('desc').value.trim()};const q=store?await db.from('stores').update(data).eq('id',store.id).select().single():await db.from('stores').insert(data).select().single();if(q.error){$('status').textContent=q.error.message;return}store=q.data;$('slug').value=store.slug;$('status').textContent='✅ Store saved!';showLink()}function showLink(){const u=location.href.replace('dashboard.html','store.html')+'?shop='+encodeURIComponent(store.slug);$('link').href=u;$('link').textContent=u}async function loadProducts(){const q=await db.from('products').select('*').eq('store_id',store.id).order('created_at',{ascending:false});if(q.error){$('status').textContent=q.error.message;return}const arr=q.data||[];$('products').innerHTML=arr.map(p=>'<div class="product">'+(p.image_url?'<img src="'+esc(p.image_url)+'">':'<div>🛍️</div>')+'<div><b>'+esc(p.name)+'</b><br>GH₵'+esc(p.price)+' · Stock: '+esc(p.stock)+'</div><div class="actions"><button onclick="editProduct(\''+p.id+'\')">Edit</button><button onclick="deleteProduct(\''+p.id+'\')">Delete</button></div></div>').join('')||'<p class="muted">No products yet.</p>';window.productCache=arr}async function add(){if(!store){$('status').textContent='Save your store first.';return}const file=await pickImage();if(!file){$('status').textContent='No image selected.';return}const name=prompt('Product name');if(!name)return;const price=prompt('Price in GH₵','0');if(price===null)return;const priceNum=Number(price);if(!Number.isFinite(priceNum)||priceNum<0){$('status').textContent='Enter a valid price.';return}const stock=prompt('Stock quantity','0');if(stock===null)return;const stockNum=Number(stock);if(!Number.isInteger(stockNum)||stockNum<0){$('status').textContent='Enter a valid whole-number stock quantity.';return}let image_url=null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=user.id+'/'+crypto.randomUUID()+'.'+ext;const up=await db.storage.from('product-images').upload(path,file,{contentType:file.type||'image/jpeg',upsert:false});if(up.error){$('status').textContent='Image upload failed: '+up.error.message;return}image_url=db.storage.from('product-images').getPublicUrl(path).data.publicUrl;const q=await db.from('products').insert({store_id:store.id,name:name.trim(),price:priceNum,stock:stockNum,image_url});$('status').textContent=q.error?'❌ '+q.error.message:'✅ Product added!';loadProducts()}function pickImage(){return new Promise(resolve=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>resolve(i.files?.[0]||null);i.click()})}window.editProduct=async id=>{const p=window.productCache.find(x=>x.id===id);if(!p)return;const name=prompt('Product name',p.name);if(name===null)return;const price=prompt('Price in GH₵',p.price);if(price===null)return;const priceNum=Number(price);if(!Number.isFinite(priceNum)||priceNum<0){$('status').textContent='Enter a valid price.';return}const stock=prompt('Stock quantity',p.stock);if(stock===null)return;const stockNum=Number(stock);if(!Number.isInteger(stockNum)||stockNum<0){$('status').textContent='Enter a valid whole-number stock quantity.';return}const q=await db.from('products').update({name:name.trim(),price:priceNum,stock:stockNum,updated_at:new Date().toISOString()}).eq('id',id);$('status').textContent=q.error?q.error.message:'✅ Product updated!';loadProducts()};window.deleteProduct=async id=>{if(!confirm('Delete this product?'))return;const q=await db.from('products').delete().eq('id',id);$('status').textContent=q.error?q.error.message:'✅ Product deleted.';loadProducts()};async function loadOrders(){const q=await db.from('orders').select('*').eq('store_id',store.id).order('created_at',{ascending:false});if(q.error)return;$('orders').innerHTML=(q.data||[]).map(o=>'<div class="order"><b>'+esc(o.product_name||'Order')+'</b><br>Customer: '+esc(o.customer_name||'—')+' · '+esc(o.customer_phone||'—')+'<br>Amount: GH₵'+esc(o.amount||0)+'<br>Status: <select onchange="setOrder(\''+o.id+'\',this.value)"><option '+(o.status==='pending'?'selected':'')+'>pending</option><option '+(o.status==='confirmed'?'selected':'')+'>confirmed</option><option '+(o.status==='delivered'?'selected':'')+'>delivered</option><option '+(o.status==='cancelled'?'selected':'')+'>cancelled</option></select></div>').join('')||'<span class="muted">No orders yet.</span>'}window.setOrder=async(id,status)=>{const q=await db.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(q.error)$('status').textContent=q.error.message;else loadOrders()};$('save').onclick=save;$('add').onclick=add;$('logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};start();</script></body></html>
