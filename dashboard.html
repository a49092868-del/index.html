<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Market Seller Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#111}.top{background:#111;color:#fff;padding:16px;font-weight:900}.wrap{max-width:1000px;margin:auto;padding:16px}.box{background:#fff;padding:18px;border-radius:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f7f7f7;padding:14px;border-radius:12px}.stat b{font-size:24px;display:block}.field{margin:9px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px}.btn{padding:11px 15px;border:0;border-radius:9px;background:#ffd400;font-weight:bold;cursor:pointer}.dark{background:#111;color:#fff}.product,.order{padding:12px;border:1px solid #eee;border-radius:12px;margin:8px 0}.product{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center}.product img{width:72px;height:72px;object-fit:cover;border-radius:9px}.actions button{margin:2px;padding:7px;border:0;border-radius:6px}.muted{color:#777}.ok{color:#087b35}.bad{color:#b00020}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}.product{grid-template-columns:60px 1fr}.actions{grid-column:2}.product img{width:60px;height:60px}}</style></head><body><div class="top">🛍️ NOVA MARKET — SELLER DASHBOARD</div><main class="wrap"><div class="box"><h1>My Store</h1><p id="account" class="muted">Checking account...</p><div class="grid"><div class="stat"><b id="statProducts">0</b>Products</div><div class="stat"><b id="statPending">0</b>Pending orders</div><div class="stat"><b id="statOrders">0</b>Total orders</div><div class="stat"><b id="statSales">GH₵0</b>Order value</div></div></div><div class="box"><h2>Store branding</h2><div class="field"><label>Store name</label><input id="name"></div><div class="field"><label>Store URL</label><input id="slug" placeholder="my-store"></div><div class="field"><label>WhatsApp</label><input id="wa" placeholder="233XXXXXXXXX"></div><div class="field"><label>Description</label><textarea id="desc"></textarea></div><div class="field"><label>Store logo</label><input id="logo" type="file" accept="image/*"></div><div class="field"><label>Store banner</label><input id="banner" type="file" accept="image/*"></div><button class="btn" id="save">Save store</button><p id="status"></p></div><div class="box"><h2>Products</h2><button class="btn" id="add">+ Add product</button><div id="products"><span class="muted">No products yet.</span></div></div><div class="box"><h2>Orders</h2><div id="orders"><span class="muted">No orders yet.</span></div></div><div class="box"><h2>Public store</h2><a id="link">Save your store first</a></div><button class="btn dark" id="logout">Log out</button></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cjaukxtlnppxzuhwozyf.supabase.co','sb_publishable_CbfRdYSeGGztUkiMqwk6Iw_55WqqwiN');let user,store,cache=[];const $=x=>document.getElementById(x);function slug(x){return x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function upload(file){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=user.id+'/'+crypto.randomUUID()+'.'+ext;const u=await db.storage.from('product-images').upload(path,file,{contentType:file.type||'image/jpeg'});if(u.error)throw u.error;return db.storage.from('product-images').getPublicUrl(path).data.publicUrl}async function start(){const r=await db.auth.getUser();user=r.data.user;if(!user){location.href='login.html';return}$('account').textContent='Logged in: '+user.email;const q=await db.from('stores').select('*').eq('owner_id',user.id).maybeSingle();if(q.error){$('status').textContent=q.error.message;return}store=q.data;if(store){$('name').value=store.name||'';$('slug').value=store.slug||'';$('wa').value=store.whatsapp||'';$('desc').value=store.description||'';showLink();await loadProducts();await loadOrders()}}async function save(){const name=$('name').value.trim(),s=slug($('slug').value||name);if(!name||s.length<3){$('status').textContent='Enter a store name and a URL of at least 3 characters.';return}try{let logo_url=store?.logo_url||null,banner_url=store?.banner_url||null;if($('logo').files[0])logo_url=await upload($('logo').files[0]);if($('banner').files[0])banner_url=await upload($('banner').files[0]);const data={owner_id:user.id,name,slug:s,whatsapp:$('wa').value.replace(/\D/g,''),description:$('desc').value.trim(),logo_url,banner_url};const q=store?await db.from('stores').update(data).eq('id',store.id).select().single():await db.from('stores').insert(data).select().single();if(q.error){$('status').textContent='❌ '+q.error.message;return}store=q.data;$('status').textContent='✅ Store saved!';showLink()}catch(e){$('status').textContent='❌ Image upload failed: '+e.message}}function showLink(){const u=location.href.replace('dashboard.html','store.html')+'?shop='+encodeURIComponent(store.slug);$('link').href=u;$('link').textContent=u}async function loadProducts(){const q=await db.from('products').select('*').eq('store_id',store.id).order('created_at',{ascending:false});if(q.error){$('status').textContent=q.error.message;return}cache=q.data||[];$('products').innerHTML=cache.map(p=>'<div class="product">'+(p.image_url?'<img src="'+esc(p.image_url)+'">':'<div>🛍️</div>')+'<div><b>'+esc(p.name)+'</b> '+(p.active?'':'<span class="muted">(hidden)</span>')+'<br>GH₵'+Number(p.price).toFixed(2)+' · '+esc(p.category||'Other')+' · Stock: '+esc(p.stock)+'</div><div class="actions"><button onclick="editProduct(\''+p.id+'\')">Edit</button><button onclick="deleteProduct(\''+p.id+'\')">Delete</button></div></div>').join('')||'<p class="muted">No products yet.</p>';$('statProducts').textContent=cache.length}async function add(){if(!store){$('status').textContent='Save your store first.';return}const file=await pick();if(!file){$('status').textContent='No image selected.';return}const name=prompt('Product name');if(!name)return;const description=prompt('Product description','');const price=prompt('Price in GH₵','0');if(price===null)return;const priceNum=Number(price);if(!Number.isFinite(priceNum)||priceNum<0){$('status').textContent='Enter a valid price.';return}const stock=prompt('Stock quantity','0');if(stock===null)return;const stockNum=Number(stock);if(!Number.isInteger(stockNum)||stockNum<0){$('status').textContent='Enter a valid whole number.';return}const categories=['Men','Women','Shoes','Bags','Watches','Accessories','Caps','Perfumes','Other'];const category=prompt('Category: Men, Women, Shoes, Bags, Watches, Accessories, Caps, Perfumes or Other','Other')||'Other';let image_url;try{image_url=await upload(file)}catch(e){$('status').textContent='❌ Image upload failed: '+e.message;return}const q=await db.from('products').insert({store_id:store.id,name:name.trim(),description:description||'',price:priceNum,stock:stockNum,image_url,category:categories.includes(category)?category:'Other',active:true}).select().single();if(q.error){$('status').textContent='❌ Product was NOT saved: '+q.error.message;return}$('status').textContent='✅ Product saved successfully!';await loadProducts()}function pick(){return new Promise(r=>{const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>r(i.files?.[0]||null);i.click()})}window.editProduct=async id=>{const p=cache.find(x=>x.id===id);if(!p)return;const name=prompt('Product name',p.name);if(name===null)return;const description=prompt('Description',p.description||'');if(description===null)return;const price=prompt('Price in GH₵',p.price);if(price===null)return;const stock=prompt('Stock quantity',p.stock);if(stock===null)return;const category=prompt('Category',p.category||'Other');if(category===null)return;const active=confirm('Show this product publicly?');const q=await db.from('products').update({name:name.trim(),description,price:Number(price),stock:Number(stock),category:category.trim()||'Other',active,updated_at:new Date().toISOString()}).eq('id',id);$('status').textContent=q.error?'❌ '+q.error.message:'✅ Product updated!';loadProducts()};window.deleteProduct=async id=>{if(!confirm('Delete this product?'))return;const q=await db.from('products').delete().eq('id',id);$('status').textContent=q.error?'❌ '+q.error.message:'✅ Product deleted.';loadProducts()};async function loadOrders(){const q=await db.from('orders').select('*').eq('store_id',store.id).order('created_at',{ascending:false});if(q.error)return;const a=q.data||[];$('statOrders').textContent=a.length;$('statPending').textContent=a.filter(x=>x.status==='pending').length;$('statSales').textContent='GH₵'+a.filter(x=>x.status!=='cancelled').reduce((n,x)=>n+Number(x.amount||0),0).toFixed(2);$('orders').innerHTML=a.map(o=>'<div class="order"><b>'+esc(o.product_name||'Order')+'</b><br>Customer: '+esc(o.customer_name||'—')+' · '+esc(o.customer_phone||'—')+'<br>Amount: GH₵'+Number(o.amount||0).toFixed(2)+'<br><small>'+new Date(o.created_at).toLocaleString()+'</small><br>Status: <select onchange="setOrder(\''+o.id+'\',this.value)"><option '+(o.status==='pending'?'selected':'')+'>pending</option><option '+(o.status==='confirmed'?'selected':'')+'>confirmed</option><option '+(o.status==='delivered'?'selected':'')+'>delivered</option><option '+(o.status==='cancelled'?'selected':'')+'>cancelled</option></select></div>').join('')||'<span class="muted">No orders yet.</span>'}window.setOrder=async(id,status)=>{const q=await db.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(q.error)$('status').textContent='❌ '+q.error.message;else loadOrders()};$('save').onclick=save;$('add').onclick=add;$('logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};start();</script></body></html>
