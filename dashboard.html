<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopify GH Seller Dashboard</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5;color:#111}.top{background:#111;color:#fff;padding:16px;font-weight:900}.wrap{max-width:1050px;margin:auto;padding:16px}.box{background:#fff;padding:18px;border-radius:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f7f7f7;padding:14px;border-radius:12px}.stat b{font-size:23px;display:block}.field{margin:9px 0}.field label{display:block;font-weight:bold;font-size:13px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px}.btn{padding:11px 15px;border:0;border-radius:9px;background:#ffd400;font-weight:bold;cursor:pointer}.dark{background:#111;color:#fff}.product,.order,.coupon{padding:12px;border:1px solid #eee;border-radius:12px;margin:8px 0}.product{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center}.product img{width:72px;height:72px;object-fit:cover;border-radius:9px}.actions button{margin:2px;padding:7px;border:0;border-radius:6px}.muted{color:#777}.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;padding:16px;z-index:10}.modalBox{background:#fff;padding:20px;border-radius:16px;width:min(520px,100%);max-height:90vh;overflow:auto}.modalBox input,.modalBox textarea,.modalBox select{width:100%;padding:11px;margin:6px 0 10px;border:1px solid #ddd;border-radius:8px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.product{grid-template-columns:60px 1fr}.actions{grid-column:2}}
</style></head><body><div class="top">🛍️ SHOPIFY GH — SELLER DASHBOARD</div><main class="wrap">
<div class="box"><h1>My Store</h1><p id="account" class="muted">Checking account...</p><div class="grid"><div class="stat"><b id="statProducts">0</b>Products</div><div class="stat"><b id="statPending">0</b>Pending</div><div class="stat"><b id="statOrders">0</b>Orders</div><div class="stat"><b id="statSales">GH₵0</b>Sales value</div></div><p id="analytics"></p></div>
<div class="box"><h2>Store branding</h2><div class="field"><label>Store name</label><input id="name"></div><div class="field"><label>Store URL</label><input id="slug"></div><div class="field"><label>WhatsApp</label><input id="wa"></div><div class="field"><label>Description</label><textarea id="desc"></textarea></div><div class="field"><label>Logo</label><input id="logo" type="file" accept="image/*"></div><div class="field"><label>Banner</label><input id="banner" type="file" accept="image/*"></div><button class="btn" id="save">Save store</button><p id="status"></p><a id="link"></a></div>
<div class="box"><h2>Products</h2><button class="btn" id="add">+ Add product</button><div id="products"></div></div>
<div class="box"><h2>Discount codes</h2><div class="field"><input id="cCode" placeholder="Code e.g. WELCOME10"></div><div class="field"><select id="cType"><option value="percent">Percent</option><option value="fixed">Fixed GH₵</option></select></div><div class="field"><input id="cValue" type="number" min="0" placeholder="Value"></div><div class="field"><input id="cLimit" type="number" min="1" placeholder="Usage limit (optional)"></div><button class="btn" id="addCoupon">Create coupon</button><div id="coupons"></div></div>
<div class="box"><h2>Orders</h2><div id="orders"></div></div><button class="btn dark" id="logout">Log out</button></main>
<div class="modal" id="pm"><div class="modalBox"><h2>Edit product</h2><input type="hidden" id="pid"><label>Name</label><input id="pn"><label>Description</label><textarea id="pd"></textarea><label>Price</label><input id="pp" type="number" min="0"><label>Stock</label><input id="ps" type="number" min="0"><label>Category</label><select id="pc"><option>Men</option><option>Women</option><option>Shoes</option><option>Bags</option><option>Watches</option><option>Accessories</option><option>Caps</option><option>Perfumes</option><option>Other</option></select><label>Visible</label><select id="pa"><option value="true">Yes</option><option value="false">No</option></select><button class="btn" onclick="saveProduct()">Save</button> <button onclick="closeEdit()">Cancel</button></div></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cjaukxtlnppxzuhwozyf.supabase.co','sb_publishable_CbfRdYSeGGztUkiMqwk6Iw_55WqqwiN');let user,store,cache=[];const $=x=>document.getElementById(x);function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function slug(x){return x.toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}async function upload(f){if(!f)return null;let path=user.id+'/'+crypto.randomUUID()+'.'+(f.name.split('.').pop()||'jpg');let q=await db.storage.from('product-images').upload(path,f,{contentType:f.type||'image/jpeg'});if(q.error)throw q.error;return db.storage.from('product-images').getPublicUrl(path).data.publicUrl}
async function start(){let r=await db.auth.getUser();user=r.data.user;if(!user)return location.href='login.html';$('account').textContent='Logged in: '+user.email;let q=await db.from('stores').select('*').eq('owner_id',user.id).maybeSingle();store=q.data;if(store){$('name').value=store.name||'';$('slug').value=store.slug||'';$('wa').value=store.whatsapp||'';$('desc').value=store.description||'';await loadAll();showLink()}}
async function loadAll(){await loadProducts();await loadOrders();await loadCoupons()}function showLink(){let u=location.hostname.endsWith('github.io')?location.origin+'/store.html?shop='+encodeURIComponent(store.slug):location.origin+'/store/'+encodeURIComponent(store.slug);$('link').href=u;$('link').textContent='Open public store →'}
$('save').onclick=async()=>{let name=$('name').value.trim(),s=slug($('slug').value||name);if(!name||s.length<3)return $('status').textContent='Enter a store name and valid URL.';try{let logo_url=store?.logo_url||null,banner_url=store?.banner_url||null;if($('logo').files[0])logo_url=await upload($('logo').files[0]);if($('banner').files[0])banner_url=await upload($('banner').files[0]);let data={owner_id:user.id,name,slug:s,whatsapp:$('wa').value.replace(/\D/g,''),description:$('desc').value.trim(),logo_url,banner_url};let q=store?await db.from('stores').update(data).eq('id',store.id).select().single():await db.from('stores').insert(data).select().single();if(q.error)return $('status').textContent='❌ '+q.error.message;store=q.data;$('status').textContent='✅ Store saved!';showLink()}catch(e){$('status').textContent='❌ '+e.message}};
async function pick(){return new Promise(r=>{let i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>r(i.files?.[0]);i.click()})}
$('add').onclick=async()=>{if(!store)return $('status').textContent='Save your store first.';let f=await pick();if(!f)return;let n=prompt('Product name');if(!n)return;let d=prompt('Description','')||'',p=Number(prompt('Price in GH₵','0')),s=Number(prompt('Stock','0')),c=prompt('Category','Other')||'Other';if(!Number.isFinite(p)||p<0||!Number.isInteger(s)||s<0)return $('status').textContent='Invalid price or stock.';try{let img=await upload(f),q=await db.from('products').insert({store_id:store.id,name:n.trim(),description:d,price:p,stock:s,category:c,active:true,featured:false}).select().single();if(q.error)throw q.error;await db.from('products').update({image_url:img}).eq('id',q.data.id);$('status').textContent='✅ Product added';loadProducts()}catch(e){$('status').textContent='❌ '+e.message}}
async function loadProducts(){if(!store)return;let q=await db.from('products').select('*').eq('store_id',store.id).order('created_at',{ascending:false});cache=q.data||[];$('statProducts').textContent=cache.length;$('products').innerHTML=cache.map(p=>'<div class="product">'+(p.image_url?'<img src="'+esc(p.image_url)+'">':'🛍️')+'<div><b>'+esc(p.name)+'</b> '+(p.featured?'⭐':'')+' '+(p.active?'':'<span class="muted">(hidden)</span>')+'<br>GH₵'+Number(p.price).toFixed(2)+' · '+esc(p.category||'Other')+' · Stock '+p.stock+'</div><div class="actions"><button onclick="editProduct(\''+p.id+'\')">Edit</button><button onclick="toggleFeatured(\''+p.id+'\')">'+(p.featured?'Unfeature':'Feature')+'</button><button onclick="deleteProduct(\''+p.id+'\')">Delete</button></div></div>').join('')||'<p class="muted">No products yet.</p>'}
window.editProduct=id=>{let p=cache.find(x=>x.id===id);if(!p)return;$('pid').value=id;$('pn').value=p.name;$('pd').value=p.description||'';$('pp').value=p.price;$('ps').value=p.stock;$('pc').value=p.category||'Other';$('pa').value=String(p.active);$('pm').style.display='grid'};window.closeEdit=()=>$('pm').style.display='none';window.saveProduct=async()=>{let id=$('pid').value,q=await db.from('products').update({name:$('pn').value.trim(),description:$('pd').value.trim(),price:Number($('pp').value),stock:Number($('ps').value),category:$('pc').value,active:$('pa').value==='true',updated_at:new Date().toISOString()}).eq('id',id);$('status').textContent=q.error?'❌ '+q.error.message:'✅ Product updated';closeEdit();loadProducts()};window.toggleFeatured=async id=>{let p=cache.find(x=>x.id===id);await db.from('products').update({featured:!p.featured}).eq('id',id);loadProducts()};window.deleteProduct=async id=>{if(confirm('Delete this product?')){await db.from('products').delete().eq('id',id);loadProducts()}};
async function loadOrders(){let q=await db.from('orders').select('*').eq('store_id',store.id).order('created_at',{ascending:false});let a=q.data||[];$('statOrders').textContent=a.length;$('statPending').textContent=a.filter(x=>x.status==='pending').length;$('statSales').textContent='GH₵'+a.filter(x=>x.status!=='cancelled').reduce((n,x)=>n+Number(x.total??x.amount??0),0).toFixed(2);$('analytics').textContent='Confirmed/delivered orders: '+a.filter(x=>x.status==='confirmed'||x.status==='delivered').length+' · Average order: GH₵'+(a.length?(a.reduce((n,x)=>n+Number(x.total??x.amount??0),0)/a.length).toFixed(2):'0.00');$('orders').innerHTML=a.map(o=>'<div class="order"><b>'+esc(o.order_number||o.product_name)+'</b> · '+esc(o.customer_name)+' · GH₵'+Number(o.total??o.amount??0).toFixed(2)+'<br><small>'+new Date(o.created_at).toLocaleString()+'</small> · Status: <select onchange="setOrder(\''+o.id+'\',this.value)"><option '+(o.status==='pending'?'selected':'')+'>pending</option><option '+(o.status==='confirmed'?'selected':'')+'>confirmed</option><option '+(o.status==='delivered'?'selected':'')+'>delivered</option><option '+(o.status==='cancelled'?'selected':'')+'>cancelled</option></select></div>').join('')||'<p class="muted">No orders yet.</p>'}
window.setOrder=async(id,status)=>{await db.from('orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);loadOrders()};
$('addCoupon').onclick=async()=>{let code=$('cCode').value.trim().toUpperCase(),type=$('cType').value,value=Number($('cValue').value),limit=$('cLimit').value?Number($('cLimit').value):null;if(!code||!value||value<0)return;$('cCode').value='';let q=await db.from('discount_codes').insert({store_id:store.id,code,type,value,usage_limit:limit});$('status').textContent=q.error?'❌ '+q.error.message:'✅ Coupon created';loadCoupons()};
async function loadCoupons(){let q=await db.from('discount_codes').select('*').eq('store_id',store.id).order('created_at',{ascending:false});$('coupons').innerHTML=(q.data||[]).map(c=>'<div class="coupon"><b>'+esc(c.code)+'</b> — '+c.value+(c.type==='percent'?'%':' GH₵')+' · used '+c.used_count+' <button onclick="toggleCoupon(\''+c.id+'\','+(!c.active)+')">'+(c.active?'Disable':'Enable')+'</button></div>').join('')||'<p class="muted">No coupons.</p>'}window.toggleCoupon=async(id,v)=>{await db.from('discount_codes').update({active:v}).eq('id',id);loadCoupons()};
$('logout').onclick=async()=>{await db.auth.signOut();location.href='login.html'};start();
</script></body></html>
