<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Market — Create Store</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}.top{background:#101010;color:#fff;padding:15px 18px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;letter-spacing:2px}.logo b{background:#ffd400;color:#111;border-radius:9px;padding:7px 9px;margin-right:8px}.wrap{max-width:1050px;margin:auto;padding:24px 16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.box{background:#fff;border:1px solid #e4e4e4;border-radius:16px;padding:20px}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;font:inherit}.field textarea{min-height:80px}.btn{border:0;background:#ffd400;padding:13px 18px;border-radius:9px;font-weight:900;cursor:pointer}.productRow{display:grid;grid-template-columns:1fr 110px;gap:8px;margin:8px 0}.success{display:none;background:#ecfff2;border:1px solid #b8efca;padding:12px;border-radius:10px;margin-top:12px}.link{display:block;margin-top:8px;color:#111;font-weight:800;word-break:break-all}.preview{border:1px solid #ddd;border-radius:14px;overflow:hidden}.ph{background:#101010;color:#fff;padding:20px}.pb{padding:18px}.p{border:1px solid #eee;border-radius:10px;padding:12px;margin:8px 0;display:flex;justify-content:space-between}.muted{color:#777}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="logo"><b>N</b>NOVA MARKET</div><span>Merchant Dashboard</span></header><main class="wrap"><h1>🚀 Create your Nova Market store</h1><p class="muted">Enter your details, add products, then generate a shareable store link.</p><div class="grid"><section class="box"><h2>Store details</h2><div class="field"><label>Store name</label><input id="name" placeholder="e.g. Abdul Watches"></div><div class="field"><label>WhatsApp number</label><input id="wa" placeholder="233XXXXXXXXX"></div><div class="field"><label>Store description</label><textarea id="desc" placeholder="Tell customers what you sell"></textarea></div><h3>Products</h3><div id="rows"></div><button class="btn" type="button" onclick="addRow()">+ Add product</button><br><br><button class="btn" type="button" onclick="createStore()">Create my store →</button><div id="ok" class="success"></div><a id="link" class="link" style="display:none"></a></section><section class="box"><h2>Live preview</h2><div class="preview"><div class="ph"><div id="pn" style="font-size:25px;font-weight:900">Your Store</div><div id="pd" class="muted">Your description</div></div><div class="pb"><b>Products</b><div id="pp"></div></div></div></section></div></main><script>let n=0;function addRow(){n++;let r=document.createElement('div');r.className='productRow';r.innerHTML='<input class="pn" placeholder="Product name"><input class="price" type="number" placeholder="GH₵ price">';document.getElementById('rows').appendChild(r);r.querySelectorAll('input').forEach(x=>x.addEventListener('input',render));render()}function render(){document.getElementById('pn').textContent=document.getElementById('name').value.trim()||'Your Store';document.getElementById('pd').textContent=document.getElementById('desc').value.trim()||'Your description';let h='';document.querySelectorAll('.productRow').forEach(r=>{let a=r.querySelector('.pn').value.trim(),b=r.querySelector('.price').value.trim();if(a)h+='<div class="p"><span>'+esc(a)+'</span><b>GH₵'+esc(b||'0')+'</b></div>'});document.getElementById('pp').innerHTML=h||'<p class="muted">Add products to preview them.</p>'}function esc(x){return x.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function createStore(){let products=[];document.querySelectorAll('.productRow').forEach(r=>{let name=r.querySelector('.pn').value.trim();let price=r.querySelector('.price').value.trim();if(name)products.push({name,price})});let s={name:document.getElementById('name').value.trim()||'My Store',wa:document.getElementById('wa').value.replace(/\D/g,''),desc:document.getElementById('desc').value.trim()||'Welcome to my Nova Market store.',products};let data=btoa(unescape(encodeURIComponent(JSON.stringify(s))));let url=location.href.replace('dashboard.html','store.html')+'?data='+encodeURIComponent(data);document.getElementById('link').href=url;document.getElementById('link').textContent='🔗 '+url;document.getElementById('link').style.display='block';document.getElementById('ok').style.display='block';document.getElementById('ok').innerHTML='🎉 Your store link is ready! Send this link to customers.'}document.getElementById('name').addEventListener('input',render);document.getElementById('desc').addEventListener('input',render);addRow();</script></body></html>
