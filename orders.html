<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KoraMarket — Track Order</title><style>body{font-family:Arial;background:#f5f5f5;margin:0}.top{background:#111;color:#fff;padding:16px;font-weight:900}.box{max-width:500px;margin:45px auto;background:#fff;padding:25px;border-radius:16px}.box input{width:100%;padding:13px;margin:7px 0 12px;border:1px solid #ddd;border-radius:9px}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#ffd400;font-weight:900}.result{margin-top:18px;padding:15px;background:#f5f5f5;border-radius:10px}</style></head><body><div class="top">🛍️ KORAMARKET</div><main class="box"><h1>Track your order</h1><p>Enter your order number and the phone number used at checkout.</p><input id="num" placeholder="SGH-XXXXXXXXXX"><input id="phone" placeholder="Phone number"><button class="btn" onclick="track()">Track order</button><div id="result" class="result"></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cjaukxtlnppxzuhwozyf.supabase.co','sb_publishable_CbfRdYSeGGztUkiMqwk6Iw_55WqqwiN');window.track=async()=>{let r=await db.rpc('track_order',{p_order_number:document.getElementById('num').value.trim(),p_customer_phone:document.getElementById('phone').value.trim()});let x=r.data?.[0];document.getElementById('result').innerHTML=r.error?'<b>'+r.error.message+'</b>':x?'<h3>Order '+x.order_number+'</h3><p>Status: <b>'+x.status+'</b></p><p>Total: GH₵'+Number(x.total||0).toFixed(2)+'</p><p>Placed: '+new Date(x.created_at).toLocaleString()+'</p>':'Order not found. Check the order number and phone number.'}</script></body></html>
