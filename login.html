<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nova Market — Seller Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#111}.top{background:#101010;color:#fff;padding:16px 20px}.logo{font-weight:900;letter-spacing:2px}.logo b{background:#ffd400;color:#111;padding:7px 9px;border-radius:8px;margin-right:8px}.wrap{max-width:460px;margin:45px auto;padding:20px}.box{background:#fff;border-radius:18px;padding:25px;border:1px solid #e4e4e4}.field{margin:13px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px;font:inherit}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#ffd400;font-weight:900;cursor:pointer;margin-top:8px}.secondary{background:#111;color:#fff}.msg{margin-top:14px;padding:12px;border-radius:9px;background:#f1f1f1}.small{text-align:center;color:#777;font-size:13px;margin-top:15px}</style></head><body><header class="top"><div class="logo"><b>N</b>NOVA MARKET</div></header><main class="wrap"><section class="box"><h1 id="title">Seller account</h1><p id="sub">Create your Nova Market seller account.</p><div class="field" id="nameWrap"><label>Full name</label><input id="fullName" placeholder="Your name"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" placeholder="At least 6 characters"></div><button class="btn" id="mainBtn">Create account</button><button class="btn secondary" id="switchBtn">I already have an account</button><div id="msg" class="msg" style="display:none"></div><div class="small">Seller accounts let you manage a permanent Nova Market store.</div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const supabase=createClient('https://cjaukxtlnppxzuhwozyf.supabase.co','sb_publishable_CbfRdYSeGGztUkiMqwk6Iw_55WqqwiN');let signup=true;const $=id=>document.getElementById(id);function mode(){signup=!signup;$('title').textContent=signup?'Seller account':'Welcome back';$('sub').textContent=signup?'Create your Nova Market seller account.':'Log in to manage your store.';$('nameWrap').style.display=signup?'block':'none';$('mainBtn').textContent=signup?'Create account':'Log in';$('switchBtn').textContent=signup?'I already have an account':'Create a new account'}$('switchBtn').onclick=mode;$('mainBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,fullName=$('fullName').value.trim();if(!email||password.length<6){$('msg').style.display='block';$('msg').textContent='Please enter a valid email and a password of at least 6 characters.';return}let r=signup?await supabase.auth.signUp({email,password,options:{data:{full_name:fullName}}}):await supabase.auth.signInWithPassword({email,password});if(r.error){$('msg').style.display='block';$('msg').textContent=r.error.message;return}if(signup&&!r.data.session){$('msg').style.display='block';$('msg').textContent='Account created. Check your email to confirm, then log in.';return}location.href='dashboard.html'};</script></body></html>
