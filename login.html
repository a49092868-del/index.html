<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopify GH — Seller Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f5f5}.top{background:#111;color:#fff;padding:16px;font-weight:900}.wrap{max-width:460px;margin:45px auto;padding:20px}.box{background:#fff;border-radius:18px;padding:25px;border:1px solid #ddd}.field{margin:13px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}.field input{width:100%;padding:13px;border:1px solid #ddd;border-radius:9px}.btn{width:100%;padding:13px;border:0;border-radius:9px;background:#ffd400;font-weight:900;cursor:pointer;margin-top:8px}.secondary{background:#111;color:#fff}.msg{margin-top:14px;padding:12px;background:#f1f1f1;border-radius:9px}</style></head><body><header class="top">🛍️ SHOPIFY GH</header><main class="wrap"><section class="box"><h1 id="title">Seller account</h1><p id="sub">Create your Shopify GH seller account.</p><div id="nw" class="field"><label>Full name</label><input id="full"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="pass" type="password"></div><button class="btn" id="main">Create account</button><button class="btn secondary" id="switch">I already have an account</button><button class="btn" id="reset">Forgot password?</button><div id="msg" class="msg" style="display:none"></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://cjaukxtlnppxzuhwozyf.supabase.co','sb_publishable_CbfRdYSeGGztUkiMqwk6Iw_55WqqwiN');let signup=true;const $=x=>document.getElementById(x);function mode(){signup=!signup;$('title').textContent=signup?'Seller account':'Welcome back';$('sub').textContent=signup?'Create your Shopify GH seller account.':'Log in to manage your store.';$('nw').style.display=signup?'block':'none';$('main').textContent=signup?'Create account':'Log in';$('switch').textContent=signup?'I already have an account':'Create a new account'}$('switch').onclick=mode;$('main').onclick=async()=>{let email=$('email').value.trim(),password=$('pass').value;if(!email||password.length<6)return show('Enter a valid email and password of at least 6 characters.');let r=signup?await db.auth.signUp({email,password,options:{data:{full_name:$('full').value.trim()}}}):await db.auth.signInWithPassword({email,password});if(r.error)return show(r.error.message);if(signup&&!r.data.session)return show('Account created. You can now log in.');location.href='dashboard.html'};$('reset').onclick=async()=>{let email=$('email').value.trim();if(!email)return show('Enter your email first.');let r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/login.html'});show(r.error?r.error.message:'Password reset email sent.');};function show(x){$('msg').style.display='block';$('msg').textContent=x}</script></body></html>
